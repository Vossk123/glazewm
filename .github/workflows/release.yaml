name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      override_n:
        type: string
        default: ""
        description: >-
          Force the auto-increment number (version becomes
          3.10.1-stage.manager.<N>). Leave empty to use the CI run number.

permissions:
  contents: write

concurrency:
  group: release

jobs:
  meta:
    # Auto-publish on every push to `main`, unless the head commit message
    # contains `[skip release]`. Manual dispatch always runs.
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.compute.outputs.release_version }}
      numeric_version: ${{ steps.compute.outputs.numeric_version }}
    steps:
      - name: Compute versions
        id: compute
        env:
          OVERRIDE_N: ${{ inputs.override_n }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          N="${OVERRIDE_N:-$RUN_NUMBER}"
          if [[ ! "$N" =~ ^[0-9]+$ ]]; then
            echo "override_n must be a positive integer, got: $N" >&2
            exit 1
          fi
          # Shown to humans (tag + asset names): keeps the stage-manager line.
          echo "release_version=3.10.1-stage.manager.$N" >> "$GITHUB_OUTPUT"
          # Fed to `cargo build`/WiX: MSI and Win32 version resources only
          # accept numeric dotted versions, so the label stays out of here.
          echo "numeric_version=3.10.1.$N" >> "$GITHUB_OUTPUT"

  package:
    needs: meta
    uses: ./.github/workflows/package.yaml
    with:
      version_number: ${{ needs.meta.outputs.numeric_version }}

  release:
    needs: [meta, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-*

      # Release assets: the universal installer plus one portable zip per
      # architecture (raw binaries for drop-in upgrades). The standalone
      # MSIs are intentionally not published - the bundle covers both archs.
      - name: Stage release assets
        env:
          VERSION: v${{ needs.meta.outputs.release_version }}
        run: |
          mv installer-universal.exe "glazewm-$VERSION.exe"
          X64_DIR="build-x86_64-pc-windows-msvc/temp/target/x86_64-pc-windows-msvc/release"
          ARM_DIR="build-aarch64-pc-windows-msvc/temp/target/aarch64-pc-windows-msvc/release"
          (cd "$X64_DIR" && zip -q "$GITHUB_WORKSPACE/glazewm-$VERSION-portable-win-x64.zip" \
            glazewm.exe glazewm-cli.exe glazewm-watcher.exe)
          (cd "$ARM_DIR" && zip -q "$GITHUB_WORKSPACE/glazewm-$VERSION-portable-win-arm64.zip" \
            glazewm.exe glazewm-cli.exe glazewm-watcher.exe)
          ls -la . "$X64_DIR" "$ARM_DIR"

      - name: Write release notes
        env:
          VERSION: v${{ needs.meta.outputs.release_version }}
        run: |
          cat > release-notes.md <<'EOF'
          __VERSION__

          ## 文件用法 / Release files

          **中文**

          - `glazewm-__VERSION__.exe` — **标准图形安装器**（Universal，运行时自动选择 x64/arm64）。双击安装，会直接覆盖官方 GlazeWM（同一升级代码），附带 Zebar 与开机自启。本 fork 无代码签名证书，SmartScreen 拦截时选「更多信息 → 仍要运行」。
          - `glazewm-__VERSION__-portable-win-x64.zip`（Intel/AMD）与 `-arm64.zip`（ARM）— **便携包**，适合已安装 GlazeWM 的覆盖升级：先 `glazewm command wm-exit` 退出，再解压覆盖 `C:\Program Files\glzr.io\GlazeWM\` 下的 `glazewm.exe`、`glazewm-watcher.exe` 与 `cli\glazewm.exe`（目录写入需要管理员权限）。

          **English**

          - `glazewm-__VERSION__.exe` — **standard graphical installer** (Universal; picks x64/arm64 at runtime). Installs over the official GlazeWM (same upgrade code), bundles Zebar and the autostart entry. Unsigned - if SmartScreen blocks it, choose "More info" → "Run anyway".
          - `glazewm-__VERSION__-portable-win-x64.zip` / `-arm64.zip` — **portable packages** for drop-in upgrades when GlazeWM is already installed: exit the WM with `glazewm command wm-exit`, then overwrite `glazewm.exe`, `glazewm-watcher.exe` and `cli\glazewm.exe` under `C:\Program Files\glzr.io\GlazeWM\` (admin rights required).
          EOF
          sed -i "s/__VERSION__/$VERSION/g" release-notes.md

      - name: Create release
        env:
          VERSION: v${{ needs.meta.outputs.release_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            "./glazewm-$VERSION.exe#$VERSION installer for Windows (universal)" \
            "./glazewm-$VERSION-portable-win-x64.zip#$VERSION portable x64 (drop-in upgrade)" \
            "./glazewm-$VERSION-portable-win-arm64.zip#$VERSION portable arm64 (drop-in upgrade)"
