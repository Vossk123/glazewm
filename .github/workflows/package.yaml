name: Package

on:
  workflow_call:
    inputs:
      version_number:
        type: string
        default: 0.0.0
        description: Version number to use for the build (e.g. `1.0.0`).
  workflow_dispatch:
    inputs:
      version_number:
        type: string
        default: 0.0.0
        description: Version number to use for the build (e.g. `1.0.0`).

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      enable_ui_access: true
      version_number: ${{ inputs.version_number }}

  package-windows:
    needs: build
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true

      - name: Install WiX and its extensions
        run: |
          dotnet tool install --global wix --version 5.0.0
          wix extension add WixToolset.UI.wixext/5 WixToolset.Util.wixext/5 WixToolset.BootstrapperApplications.wixext/5

      - name: Run packaging script
        # Unsigned on this fork: the `AZ_*`/`RFC3161_TIMESTAMP_URL` env vars
        # are intentionally not set, so `package.ps1`'s `SignFiles` skips
        # signing. Do not add empty env entries here — an empty-but-defined
        # var makes `SignFiles` think the secrets exist and fail.
        run: |
          ./resources/scripts/package.ps1 -VersionNumber $env:VERSION

      - uses: actions/upload-artifact@v6
        with:
          name: package-windows
          if-no-files-found: error
          path: out/installer-*
